services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web-app:
    build: ./web-app
    ports:
      - "5001:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: sonder
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data: