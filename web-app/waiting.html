<!DOCTYPE html> 
<html>
<head>
    <title>Color Dashboard - Loading</title>
    <link rel="stylesheet" href="waiting.css">
</head>

<body>

    <div class="container" data-image-id="{{ image_id }}">

        <h1>Color Dashboard</h1>

        {% if image_id %}
        <h2>Analyzing Your Photo...</h2>

        <p>Please wait while we find your top 5 colors!</p>

        <div class="loader"></div>

        <p>This may take a few seconds.</p>
        {% else %}
        <h2>No photo to analyze</h2>
        <a href="{{ url_for('webcam') }}">Back to the camera</a>
        {% endif %}
    </div>

</body>



</html>
